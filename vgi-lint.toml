# vgi-lint settings for this worker: https://github.com/Query-farm/vgi-lint-check
# `make lint-explain`, `vgi-lint lint` in this directory, and CI's metadata job all
# read this file. Look up a rule with `vgi-lint explain VGI123`; print the metadata tag
# contract with `vgi-lint spec`.

# The worker to attach, relative to this directory. Build it first with `make build`.
location = ".venv/bin/vgi-datadog-worker"

# Gate at info: zero findings of any severity.
fail_on = "info"

# Waive a finding only with a kind and a reason, so the waiver can be audited:
#   domain-exemption  permanent and legitimate for this worker
#   deferred          a real defect you will fix; add expires = "YYYY-MM-DD"
#   timing            slow or flaky because of the environment, not the metadata
#   tooling-bug       the linter is wrong; report it upstream
ignore = [
  # { code = "VGI146", kind = "domain-exemption", reason = "every entry point needs a key" },
]

# Adopting the gate on a worker that already has findings? Record them once with
#   vgi-lint lint --baseline vgi-lint-baseline --update-baseline
# and uncomment the next line. Only new findings fail after that.
# baseline = "vgi-lint-baseline"

# `id` is each Datadog resource's own primary key: numeric on monitors and hosts (v1 APIs), a
# string or UUID everywhere else. They are never joined to each other.
[options]
type_consistency_ignore_names = ["id"]

# VGI808 asks for foreign keys on monitor_id / incident_id. DuckDB accepts only ENFORCED +
# ALL_ROWS constraint records, and Datadog keeps downtimes and synthetic tests that point at
# monitors deleted since (and each table is read at a different moment), so no foreign key can be
# attested. incident_id is the incidents table's own primary key. Joins are documented instead.
[per_object."datadog.resources.downtimes"]
ignore = [{ code = "VGI808", kind = "domain-exemption", reason = "downtimes outlive deleted monitors; FK cannot be ENFORCED" }]
[per_object."datadog.resources.monitor_groups"]
ignore = [{ code = "VGI808", kind = "domain-exemption", reason = "read from a separate monitor listing call; FK cannot be attested as ENFORCED" }]
[per_object."datadog.resources.synthetics_tests"]
ignore = [{ code = "VGI808", kind = "domain-exemption", reason = "a test's monitor can be deleted independently; FK cannot be ENFORCED" }]
[per_object."datadog.resources.incidents"]
ignore = [{ code = "VGI808", kind = "tooling-bug", reason = "incident_id is this table's own primary key, not a reference to it" }]
